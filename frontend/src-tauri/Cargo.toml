[package]
name = "fyodor-desktop"
version = "0.3.0"
description = "Private, cross-platform local AI workspace"
authors = ["Fyodor contributors"]
edition = "2021"

[lib]
name = "fyodor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
